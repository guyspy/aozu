<!doctype html>
<meta charset="utf-8">
<title>Character rendering lifecycle check</title>
<!-- Run pnpm dev; open /scripts/check-character-lifecycle.html. Uses memory-only Characters. -->
<div id="root"></div><pre id="result" style="position:fixed;bottom:0;left:0;z-index:100;background:white;color:black"></pre>
<script type="module">
  import { createElement as h, StrictMode } from 'react'
  import { createRoot } from 'react-dom/client'
  import { MemoryRouter } from 'react-router'
  import { createCharacterEditor } from '/src/core/application/character-editor.ts'
  import { createCharacterDraft, resolveCharacterDraftLayers } from '/src/core/application/character-creation.ts'
  import { AppRoutes } from '/src/ui/routes/AppRoutes.tsx'
  import { createApplication } from '/src/bootstrap.ts'
  import '/src/ui/i18n.ts'
  import '/src/index.css'

  const result = document.querySelector('#result')
  const failures = []
  const check = (condition, message) => { if (!condition) failures.push(message) }
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
  const ready = async (predicate) => {
    for (let i = 0; i < 200; i++) { if (predicate()) return; await wait(25) }
    throw new Error(`Timed out: ${predicate}`)
  }
  const deferred = () => { let resolve; const promise = new Promise((r) => { resolve = r }); return { promise, resolve } }
  const makeCharacter = async (id, color) => {
    const canvas = document.createElement('canvas')
    canvas.width = 512; canvas.height = 768
    const context = canvas.getContext('2d')
    context.fillStyle = color; context.fillRect(100, 100, 300, 600)
    const blob = await new Promise((resolve) => canvas.toBlob(resolve))
    const inspection = { width: 512, height: 768, size: blob.size, sha256: id.repeat(64), genuineRgba: true, hasTransparentPixels: true, hasVisiblePixels: true, visibleBounds: { x: 100, y: 100, width: 300, height: 600 } }
    const asset = { blob, filename: `${id}.png`, source: 'user', inspection, canonicalSha256: inspection.sha256 }
    const character = createCharacterDraft(`test-${id}`, id)
    character.name = id
    character.variants.find((v) => v.group === 'body').layers.body = asset
    character.variants.find((v) => v.id === 'happy').layers.head = asset
    character.selected.expression = 'happy'
    return character
  }
  const characters = await Promise.all([makeCharacter('a', '#b44'), makeCharacter('b', '#46b')])
  const reads = new Map(characters.map((c) => [c.id, deferred()]))
  const atlases = new Map(characters.map((c) => [c.id, deferred()]))
  const editor = createCharacterEditor({
    get: async (id) => { await reads.get(id).promise; return { character: characters.find((c) => c.id === id), version: 1 } },
  }, () => {}, async () => { throw new Error('Fixture inspections already exist') })
  let failAtlas = false, navigateTo
  const application = {
    editor,
    webmcp: { getState: () => ({ status: 'ready', toolCount: 0 }), setNavigate: (navigate) => { navigateTo = navigate; return () => {} }, subscribe: () => () => {} },
    subscribeCharacterChanges: () => () => {},
    loadCharacterLibrary: async () => ({ collections: [], characters: characters.map((c) => ({ ...c, revision: 1, layers: resolveCharacterDraftLayers(c) })) }),
    compileCharacterAtlas: (c) => failAtlas ? Promise.reject(new Error('Simulated atlas failure')) : atlases.get(c.id).promise,
    characterFitSuggestion: async () => ({ status: 'aligned' }),
  }
  const root = createRoot(document.querySelector('#root'))
  root.render(h(StrictMode, null, h(MemoryRouter, { initialEntries: ['/characters'] }, h(AppRoutes, { application }))))
  const releaseAtlas = (character) => {
    const frame = { frame: { x: 0, y: 0, w: 512, h: 768 }, rotated: false, trimmed: false, spriteSourceSize: { x: 0, y: 0, w: 512, h: 768 }, sourceSize: { w: 512, h: 768 } }
    atlases.get(character.id).resolve({ image: character.variants[0].layers.body.blob, data: { frames: { 'body-base-body': frame, 'expression-happy-head': frame }, meta: { app: 'Companion', version: '1', image: 'character.atlas.webp', format: 'RGBA8888', size: { w: 512, h: 768 }, scale: '1' } } })
  }
  try {
    for (const character of characters) {
      await ready(() => document.querySelector('.companion-card-open'))
      const cards = [...document.querySelectorAll('.companion-card-open')]
      cards.find((button) => button.textContent === character.name).click()
      await wait(80)
      check(!document.querySelector('.character-stage-canvas'), 'Pending character read must not show the previous editor')
      reads.get(character.id).resolve()
      await ready(() => document.querySelector('.character-stage-canvas'))
      if (!document.querySelector('.doll-workbench')) {
        document.querySelector('.character-stage-heading button').click()
        await ready(() => document.querySelector('.doll-workbench'))
      }
      check(Boolean(document.querySelector('.character-stage-canvas [role="status"]')), 'Preview must show loading until its atlas is ready')
      check(Boolean(document.querySelector('.variant-preview [role="status"]')), 'Thumbnails must show loading until their atlas is ready')
      check(!document.querySelector('.character-stage-canvas img, .variant-preview img[alt="Happy"]'), 'Pending atlas must never display raw images first')
      releaseAtlas(character)
      await ready(() => document.querySelector('.character-stage-canvas canvas') && !document.querySelector('.character-stage-canvas [role="status"]'))
      await ready(() => document.querySelector('.variant-preview img[alt="Happy"]')?.style.visibility === 'visible')
      const stage = document.querySelector('.character-stage-canvas canvas')
      const thumbnail = document.querySelector('.variant-preview img[alt="Happy"]')
      editor.store.setState({ character: { ...editor.store.getState().character, selected: { props: [] } } })
      await wait(300)
      check(stage.isConnected && document.querySelectorAll('.character-stage-canvas canvas').length === 1, 'Selection change remounted or duplicated the canvas')
      check(thumbnail.isConnected && thumbnail.complete, 'Selection change remounted or cleared a thumbnail')
      document.querySelector('[data-slot="sheet-close"]')?.click()
      await wait(250)
      document.querySelector('header button').click()
    }
    await ready(() => document.querySelector('.companion-vault'))
    for (const character of characters) atlases.set(character.id, deferred())
    navigateTo('/characters/a/expressions')
    await ready(() => document.querySelector('.character-stage-canvas [role="status"]'))
    navigateTo('/characters/b/expressions')
    await ready(() => document.querySelector('.character-stage-canvas [role="img"]')?.getAttribute('aria-label') === 'b')
    releaseAtlas(characters[0])
    await wait(80)
    check(Boolean(document.querySelector('.character-stage-canvas [role="status"]')) && !document.querySelector('.character-stage-canvas canvas, .character-stage-canvas img'), 'Late previous-character atlas escaped into the new character')
    releaseAtlas(characters[1])
    await ready(() => document.querySelector('.character-stage-canvas canvas') && !document.querySelector('.character-stage-canvas [role="status"]'))
    failAtlas = true
    navigateTo('/characters/a/expressions')
    await ready(() => document.querySelector('[role="alert"]')?.textContent === 'Simulated atlas failure')
    check(!document.querySelector('.character-stage-canvas'), 'Failed atlas must not fall back to raw art')
    failAtlas = false
    ;[...document.querySelectorAll('button')].find((button) => button.textContent === 'Retry').click()
    await ready(() => document.querySelector('.character-stage-canvas canvas') && !document.querySelector('.character-stage-canvas [role="status"]'))
    const compile = createApplication(document.implementation.createHTMLDocument()).compileCharacterAtlas
    const broken = structuredClone(characters[0])
    for (const variant of broken.variants) for (const asset of Object.values(variant.layers)) asset.blob = new Blob(['invalid image'])
    const rejected = compile(broken)
    await rejected.catch(() => {})
    const retried = compile(characters[0])
    check(retried !== rejected && Boolean(await retried), 'Rejected atlas stayed cached and prevented retry')
    check(compile(characters[0]) === retried, 'Successful atlas was not reused')
    result.textContent = failures.length ? `FAIL: ${failures.join('; ')}` : 'PASS: loading without raw-image flash, one stable canvas/thumbnail, StrictMode, late atlas cancellation, and failure/retry'
  } catch (error) {
    result.textContent = `FAIL: ${error.message}`
    throw error
  } finally {
    if (result.textContent.startsWith('PASS')) root.unmount()
  }
</script>
