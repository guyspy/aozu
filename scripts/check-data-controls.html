<!doctype html>
<meta charset="utf-8">
<title>Download controls check</title>
<!-- Run pnpm dev, then open /scripts/check-data-controls.html. No files are downloaded. -->
<div id="controls"></div><pre id="result">Running…</pre>
<script type="module">
  import { createElement } from 'react'
  import { createRoot } from 'react-dom/client'
  import { flushSync } from 'react-dom'
  import { createInstance } from 'i18next'
  import { I18nextProvider } from 'react-i18next'
  import { DataControls } from '/src/ui/DataControls.tsx'
  import '/src/index.css'

  const assert = (condition, message) => { if (!condition) throw new Error(message) }
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
  const i18n = createInstance()
  await i18n.init({ lng: 'en', resources: { en: { translation: { data: { busy: 'Working', done: 'Ready', error: 'Failed' } } } } })
  const root = createRoot(document.querySelector('#controls'))
  const originalClick = HTMLAnchorElement.prototype.click
  let filename, resolveExport, rejectExport
  HTMLAnchorElement.prototype.click = function () { filename = this.download }
  try {
    flushSync(() => root.render(createElement(I18nextProvider, { i18n }, createElement(DataControls, {
      exportIconOnly: true, exportLabel: 'Download PNG', exportFilename: '角色.png',
      exportData: () => new Promise((resolve, reject) => { resolveExport = resolve; rejectExport = reject }),
    }))))
    const button = document.querySelector('button')
    const height = document.querySelector('#controls').getBoundingClientRect().height
    button.click()
    await wait(50)
    assert(button.disabled && button.querySelector('.lucide-loader-circle'), 'Pending export must show a disabled spinner')
    resolveExport(new Blob(['fixture']))
    await wait(50)
    button.focus()
    await wait(50)
    assert(filename === '角色.png' && button.querySelector('.lucide-check'), 'Success must keep the filename and show a check')
    assert(document.querySelector('[role="tooltip"]')?.textContent === 'Ready', 'Success tooltip must describe the current state')
    assert(document.querySelector('#controls').getBoundingClientRect().height === height, 'Status must not move the layout')
    button.click()
    await wait(2_100)
    assert(button.disabled && button.querySelector('.lucide-loader-circle'), 'The previous success timer must not reset an active download')
    resolveExport(new Blob(['fixture']))
    await wait(50)
    assert(button.querySelector('.lucide-check'), 'Repeated download must show success')
    await wait(2_100)
    assert(button.querySelector('.lucide-download') && !document.querySelector('[role="status"]'), 'Success must reset after two seconds')
    button.click()
    await wait(50)
    rejectExport(new Error('Export failed'))
    await wait(50)
    assert(button.querySelector('.lucide-circle-alert') && document.querySelector('[role="alert"]')?.textContent.includes('Export failed'), 'Failure must remain available to the user')
    document.querySelector('#result').textContent = 'PASS: filename, tooltip, timer reset, repeated download, error feedback, and stable layout'
  } catch (error) {
    document.querySelector('#result').textContent = `FAIL: ${error.message}`
    throw error
  } finally {
    root.unmount()
    HTMLAnchorElement.prototype.click = originalClick
  }
</script>
